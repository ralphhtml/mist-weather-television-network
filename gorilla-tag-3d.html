<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Tag 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b1016; color: #eaf4ff;
    font-family: "Trebuchet MS", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: .95rem; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hud b { color: #ffd166; }
  #reticle { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 4px #000; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(6,10,14,.86); text-align: center; gap: 16px; padding: 24px; z-index: 5; }
  #overlay h1 { font-size: 2rem; color: #ffd166; }
  #overlay p { max-width: 520px; line-height: 1.6; opacity: .92; }
  .keys { font-size: 1rem; opacity: .9; line-height: 2; }
  kbd { background: #1b2733; border: 1px solid #33465a; border-radius: 4px; padding: 2px 9px; font-size: .9rem; }
  #overlay button { font: inherit; font-size: 1.05rem; padding: 12px 30px; cursor: pointer;
    background: #ffd166; color: #22331f; border: none; border-radius: 9px; font-weight: bold; }
  #overlay button:hover { background: #ffdd85; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">🤖 <b>ROBOT TAG 3D</b><br>Survived: <b id="time">0.0s</b><br>Best: <b id="best">0.0s</b></div>
<div id="reticle"></div>
<div id="overlay">
  <h1>🤖 ROBOT TAG 3D</h1>
  <p>Run and jump around the arena. Don't let the <b style="color:#ff6b6b">red robot</b> tag you — survive as long as you can!</p>
  <div class="keys">
    <kbd>Mouse</kbd> look &nbsp; <kbd>W A S D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Esc</kbd> pause
  </div>
  <button id="startBtn">CLICK TO PLAY</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const app = document.getElementById('app');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0e6);
scene.fog = new THREE.Fog(0x9fd0e6, 50, 180);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const yaw = new THREE.Object3D(), pitch = new THREE.Object3D();
yaw.add(pitch); pitch.add(camera); scene.add(yaw);

scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a5a3a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30,60,20); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-90; sun.shadow.camera.right=90; sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48),
  new THREE.MeshStandardMaterial({ color: 0x5a8f3a }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// platforms you can stand on (boxes): {x,z,y,w,d} top at y
const platforms = [];
function box(x, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, flatShading:true, roughness:.95 }));
  m.position.set(x, h/2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  platforms.push({ x, z, w, d, top: h, minX:x-w/2, maxX:x+w/2, minZ:z-d/2, maxZ:z+d/2 });
}
const pal = [0x8a8f96, 0x9a7b5a, 0x7d8a6b, 0xa08a7a];
for (let i=0;i<18;i++){
  const a=Math.random()*6.28, d=8+Math.random()*55;
  box(Math.cos(a)*d, Math.sin(a)*d, 4+Math.random()*4, 1.2+Math.random()*7, 4+Math.random()*4, pal[i%4]);
}
box(0,0,6,3,6,0x8a8f96); box(6,4,4,6,4,0x7d8a6b); box(-5,5,4,9,4,0x9a7b5a);

// enemy
const enemy = new THREE.Group();
const eb = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.5,0.8), new THREE.MeshStandardMaterial({color:0xff6b6b, flatShading:true}));
eb.position.y=1.15; eb.castShadow=true;
const eh = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.75,0.75), new THREE.MeshStandardMaterial({color:0xff8a8a}));
eh.position.y=2.2; eh.castShadow=true;
const ev = new THREE.Mesh(new THREE.BoxGeometry(0.92,0.2,0.06), new THREE.MeshStandardMaterial({color:0xff2222, emissive:0xaa1111}));
ev.position.set(0,2.25,0.38);
enemy.add(eb,eh,ev); scene.add(enemy);

// player
const EYE=1.7, GRAV=22, JUMP=9, SPEED=8, SPRINT=13;
const pos = new THREE.Vector3(0,EYE,32), vel = new THREE.Vector3();
let onGround=true, best=0, running=false, startTime=0;
const keys={};

function groundHeightAt(x,z){
  let h=0;
  for (const p of platforms){
    if (x>=p.minX && x<=p.maxX && z>=p.minZ && z<=p.maxZ) h=Math.max(h,p.top);
  }
  return h;
}

function update(dt){
  // move relative to look yaw
  const f=new THREE.Vector3(-Math.sin(yaw.rotation.y),0,-Math.cos(yaw.rotation.y));
  const r=new THREE.Vector3(f.z,0,-f.x);
  const dir=new THREE.Vector3();
  if(keys['w'])dir.add(f); if(keys['s'])dir.sub(f);
  if(keys['d'])dir.add(r); if(keys['a'])dir.sub(r);
  const sp=keys['shift']?SPRINT:SPEED;
  if(dir.lengthSq()){dir.normalize().multiplyScalar(sp); vel.x=dir.x; vel.z=dir.z;} else {vel.x*=.7; vel.z*=.7;}

  vel.y-=GRAV*dt;
  if(onGround && keys[' ']){ vel.y=JUMP; onGround=false; }

  pos.addScaledVector(vel,dt);

  const gh=groundHeightAt(pos.x,pos.z)+EYE;
  if(pos.y<=gh){ pos.y=gh; if(vel.y<0)vel.y=0; onGround=true; } else onGround=false;

  // keep inside arena
  const dm=Math.hypot(pos.x,pos.z); if(dm>115){ pos.x*=115/dm; pos.z*=115/dm; }

  yaw.position.copy(pos);

  // enemy chase
  const t=(performance.now()-startTime)/1000;
  const esp=3.5+Math.min(t*0.06,4);
  const ex=pos.x-enemy.position.x, ez=pos.z-enemy.position.z;
  const ed=Math.hypot(ex,ez);
  if(ed>0.3){ enemy.position.x+=ex/ed*esp*dt; enemy.position.z+=ez/ed*esp*dt; }
  enemy.rotation.y=Math.atan2(ex,ez);

  timeEl.textContent=t.toFixed(1)+'s';
  if(t>best){best=t; bestEl.textContent=best.toFixed(1)+'s';}
  if(ed<1.5) end(t);
}

function reset(){ pos.set(0,EYE,32); vel.set(0,0,0); enemy.position.set(0,0,-25);
  yaw.rotation.y=Math.PI; pitch.rotation.x=0; startTime=performance.now(); running=true; }
function end(t){ running=false; document.exitPointerLock?.();
  overlay.querySelector('h1').textContent='⚡ TAGGED!';
  overlay.querySelector('p').textContent=`You survived ${t.toFixed(1)}s. Try again?`;
  startBtn.textContent='PLAY AGAIN'; overlay.classList.remove('hidden'); }

startBtn.addEventListener('click',()=>renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement===renderer.domElement){ overlay.classList.add('hidden'); if(!running)reset(); }
  else if(running){ overlay.querySelector('h1').textContent='PAUSED';
    overlay.querySelector('p').textContent='Click to resume.'; startBtn.textContent='RESUME';
    overlay.classList.remove('hidden'); }
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement)return;
  yaw.rotation.y-=e.movementX*0.0022;
  pitch.rotation.x=Math.max(-1.5,Math.min(1.5,pitch.rotation.x-e.movementY*0.0022));
});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key===' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
(function animate(){ requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(running && document.pointerLockElement===renderer.domElement) update(dt);
  renderer.render(scene,camera);
})();
yaw.position.copy(pos); yaw.rotation.y=Math.PI;
</script>
</body>
</html>
