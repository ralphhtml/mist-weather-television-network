<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mist Television Network</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#48cae4;--deep:#023e8a;--dark:#010d1f;--green:#00e676;--sec:#b0c4de}
    html,body{height:100%;overflow:hidden}
    body{background:var(--dark);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
    body::before{content:'';position:fixed;inset:0;z-index:-1;background:url('assets/bg.png') center/cover;filter:brightness(0.38) saturate(1.2)}

    #topbar{height:64px;flex-shrink:0;background:rgba(1,8,18,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(72,202,228,0.12);display:flex;align-items:center;padding:0 28px;gap:6px;z-index:50}
    .tab-btn{padding:8px 20px;border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;background:transparent;color:#888;transition:all .15s;white-space:nowrap}
    .tab-btn.active{background:rgba(72,202,228,0.18);color:var(--blue);border-color:rgba(72,202,228,0.35)}
    .tab-btn:hover:not(.active){background:rgba(255,255,255,0.06);color:#fff}
    .logo-area{margin-left:auto;display:flex;align-items:center;gap:8px}
    .logo-area img{height:40px;mix-blend-mode:screen;filter:drop-shadow(0 0 16px rgba(72,202,228,0.4))}
    .logo-area span{font-size:16px;font-weight:200;letter-spacing:.14em}

    #main{flex:1;overflow:hidden;display:flex;flex-direction:column}
    .tab-content{flex:1;display:none;flex-direction:column;overflow:hidden}
    .tab-content.active{display:flex}

    .preview-section{padding:12px 28px 8px;flex-shrink:0}
    .preview-label{font-size:10px;font-weight:800;letter-spacing:.25em;color:var(--green);margin-bottom:8px}
    .preview-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:rgba(72,202,228,0.3) transparent}
    .preview-row::-webkit-scrollbar{height:3px}
    .preview-row::-webkit-scrollbar-thumb{background:rgba(72,202,228,0.3);border-radius:2px}
    .prev-card{width:196px;height:110px;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0;cursor:pointer;border:1px solid rgba(72,202,228,0.15);transition:transform .15s,border-color .15s,box-shadow .15s;background:#0a1a30}
    .prev-card:hover{transform:scale(1.05);border-color:var(--blue);box-shadow:0 0 20px rgba(72,202,228,0.25)}
    .prev-thumb{width:100%;height:100%;object-fit:cover;display:block}
    .prev-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 55%)}
    .prev-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none}
    .prev-card:hover .prev-play{opacity:1}
    .prev-live{position:absolute;top:6px;left:6px;background:var(--green);color:#000;font-size:9px;font-weight:900;padding:2px 5px;border-radius:3px}
    .prev-ch{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:var(--sec);font-size:9px;padding:2px 5px;border-radius:3px}
    .prev-title{position:absolute;bottom:6px;left:6px;right:6px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .filter-bar{padding:6px 28px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06);position:relative}
    .filter-lbl{font-size:12px;color:var(--sec)}
    .filter-pill{padding:5px 14px;border-radius:20px;border:1px solid rgba(72,202,228,.2);background:rgba(255,255,255,.04);color:#999;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .filter-pill:hover{border-color:rgba(72,202,228,.45);color:#fff}
    .filter-pill.active{border-color:var(--blue);color:var(--blue);background:rgba(72,202,228,.1)}
    .cat-wrap{position:relative}
    .dropdown{position:absolute;top:calc(100% + 6px);left:0;background:#001830;border:1px solid rgba(72,202,228,.28);border-radius:8px;min-width:190px;max-height:260px;overflow-y:auto;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.6);scrollbar-width:thin}
    .dropdown.hidden{display:none}
    .dd-item{padding:9px 16px;font-size:13px;cursor:pointer;color:#bbb;transition:background .1s,color .1s}
    .dd-item:hover{background:rgba(72,202,228,.1);color:#fff}
    .dd-item.sel{color:var(--blue);font-weight:600}

    .ch-count{padding:4px 28px;font-size:11px;color:var(--sec);flex-shrink:0}
    .ch-list{flex:1;overflow-y:auto;padding:2px 20px 16px;scrollbar-width:thin;scrollbar-color:rgba(72,202,228,.15) transparent}
    .ch-list::-webkit-scrollbar{width:3px}
    .ch-list::-webkit-scrollbar-thumb{background:rgba(72,202,228,.2);border-radius:2px}
    .ch-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:background .1s,border-color .1s}
    .ch-item:hover{background:rgba(72,202,228,.07);border-color:rgba(72,202,228,.2)}
    .ch-num{width:44px;font-size:14px;font-weight:700;color:var(--sec);flex-shrink:0;text-align:right}
    .ch-item:hover .ch-num{color:var(--blue)}
    .ch-icon{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
    .ch-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .ch-info{flex:1;min-width:0}
    .ch-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ch-cats{font-size:11px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ch-views{font-size:11px;color:var(--sec);flex-shrink:0}
    .ch-status{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;width:48px;flex-shrink:0}
    .ch-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .s-live{color:var(--green)}.s-live .ch-dot{background:var(--green)}
    .s-off{color:#333}.s-off .ch-dot{background:#222}

    .coming-soon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
    .cs-title{font-size:24px;font-weight:300;color:var(--blue)}
    .cs-sub{font-size:14px;color:var(--sec);opacity:.5}

    #player-overlay{position:fixed;inset:0;z-index:1000;background:#000;display:none}
    #player-overlay.show{display:block}
    #player-video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
    .player-bar{position:absolute;top:0;left:0;right:0;padding:16px 24px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);display:flex;align-items:center;gap:14px;z-index:10}
    .p-icon{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .p-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .p-meta{display:flex;align-items:center;gap:8px;margin-bottom:3px}
    .p-num{font-size:12px;color:var(--blue);font-weight:700}
    .p-badge{background:var(--green);color:#000;font-size:9px;font-weight:900;padding:2px 5px;border-radius:3px}
    .p-title{font-size:17px;font-weight:600}
    .p-cats{font-size:12px;color:var(--sec);margin-top:2px}
    .p-close{margin-left:auto;align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:6px;color:#fff;padding:7px 16px;font-size:13px;cursor:pointer;transition:background .15s}
    .p-close:hover{background:rgba(255,255,255,.2)}
    .stream-err{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:5}
    .stream-err.show{display:block}
    .err-title{font-size:20px;color:var(--sec);margin-bottom:8px}
    .err-url{font-size:12px;color:#555;word-break:break-all;max-width:400px}
    .loading{padding:40px;text-align:center;color:var(--sec);font-size:14px}

    @media(max-width:640px){
      .logo-area span{display:none}
      #topbar{padding:0 14px}
      .preview-section,.filter-bar,.ch-count,.ch-list{padding-left:14px;padding-right:14px}
      .ch-cats,.ch-views{display:none}
      .ch-num{width:32px;font-size:13px}
      .prev-card{width:150px;height:84px}
    }
  </style>
</head>
<body>
  <nav id="topbar">
    <button class="tab-btn active" data-tab="home">Home</button>
    <button class="tab-btn" data-tab="radar">Radar / Forecast</button>
    <div class="logo-area">
      <img src="assets/logo.png" alt="Mist"/>
      <span>Television Network</span>
    </div>
  </nav>

  <main id="main">
    <div id="tab-home" class="tab-content active">
      <div class="preview-section">
        <div class="preview-label">LIVE NOW</div>
        <div class="preview-row" id="preview-row"></div>
      </div>
      <div class="filter-bar">
        <span class="filter-lbl">Filter:</span>
        <div class="cat-wrap">
          <button class="filter-pill" id="cat-btn">All Categories &#9662;</button>
          <div class="dropdown hidden" id="cat-dd"></div>
        </div>
        <button class="filter-pill" id="live-btn">&#9675; Live Now</button>
      </div>
      <div class="ch-count" id="ch-count"></div>
      <div class="ch-list" id="ch-list"><div class="loading">Loading channels&#8230;</div></div>
    </div>
    <div id="tab-radar" class="tab-content">
      <div class="coming-soon">
        <div class="cs-title">Radar / Forecast</div>
        <div class="cs-sub">Coming soon</div>
      </div>
    </div>
  </main>

  <div id="player-overlay">
    <video id="player-video" controls playsinline></video>
    <div class="player-bar">
      <div id="player-info" style="display:flex;align-items:center;gap:14px;flex:1;min-width:0"></div>
      <button class="p-close" onclick="closePlayer()">&#x2715; Close</button>
    </div>
    <div class="stream-err" id="stream-err"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    const API = 'https://api.mistweather.com/api/v1.5/';
    const ASSETS = API + 'assets/';
    const PROXY = 'https://corsproxy.io/?url=';
    const FALLBACK = id => 'https://stream.mistweather.com/hls/' + id + '/index.m3u8';

    let store = {}, all = [], live = [], shown = [];
    let filterCat = null, filterLive = false, ddOpen = false, hlsInst = null;

    async function apiFetch(path) {
      const url = API + path;
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('direct ' + r.status);
        return r.json();
      } catch(e) {
        const r = await fetch(PROXY + encodeURIComponent(url));
        if (!r.ok) throw new Error('proxy ' + r.status);
        return r.json();
      }
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function boot() {
      try {
        all = (await apiFetch('channels')).sort((a, b) => a.number - b.number);
        all.forEach(c => store[c.id] = c);
        live = all.filter(c => c.online);
        renderPreviews();
        applyFilter();
      } catch(e) {
        document.getElementById('ch-list').innerHTML =
          '<div class="loading">Could not load channels: ' + e.message + '</div>';
      }
    }

    function renderPreviews() {
      const row = document.getElementById('preview-row');
      const sec = document.querySelector('.preview-section');
      if (!live.length) { sec.style.display = 'none'; return; }
      row.innerHTML = live.map(c => {
        const thumb = c.banner || c.icon;
        return '<div class="prev-card" data-id="' + c.id + '">' +
          (thumb ? '<img class="prev-thumb" src="' + ASSETS + thumb + '" onerror="this.style.display=\'none\'" alt="">' : '') +
          '<div style="position:absolute;inset:0;background:' + (c.color || '#0a3060') + ';z-index:-1"></div>' +
          '<div class="prev-overlay"></div>' +
          '<div class="prev-play">&#9654;</div>' +
          '<div class="prev-live">LIVE</div>' +
          '<div class="prev-ch">CH ' + c.number + '</div>' +
          '<div class="prev-title">' + esc(c.title) + '</div>' +
          '</div>';
      }).join('');
      row.addEventListener('click', function(e) {
        var card = e.target.closest('.prev-card');
        if (card) openPlayer(store[card.dataset.id]);
      });
    }

    function applyFilter() {
      shown = all.filter(function(c) {
        var catOk = !filterCat || (c.categories && c.categories.includes(filterCat));
        var liveOk = !filterLive || c.online;
        return catOk && liveOk;
      });
      renderList();
    }

    function renderList() {
      var el = document.getElementById('ch-list');
      var count = document.getElementById('ch-count');
      var lc = shown.filter(function(c) { return c.online; }).length;
      count.textContent = shown.length + ' channels' + (lc ? ' · ' + lc + ' live' : '');
      if (!shown.length) { el.innerHTML = '<div class="loading">No channels match this filter.</div>'; return; }
      el.innerHTML = shown.map(function(c) {
        var iconUrl = c.icon ? ASSETS + c.icon : null;
        var bg = c.color || '#0a3060';
        var init = c.title.trim().slice(0, 2).toUpperCase();
        var cats = c.categories ? c.categories.slice(0, 3).join(' · ') : '';
        return '<div class="ch-item" data-id="' + c.id + '">' +
          '<div class="ch-num">' + c.number + '</div>' +
          '<div class="ch-icon" style="background:' + bg + '" id="icon-' + c.id + '">' +
          (iconUrl ? '<img src="' + iconUrl + '" onerror="document.getElementById(\'icon-' + c.id + '\').textContent=\'' + init + '\'" alt="">' : init) +
          '</div>' +
          '<div class="ch-info">' +
          '<div class="ch-title">' + esc(c.title) + '</div>' +
          (cats ? '<div class="ch-cats">' + esc(cats) + '</div>' : '') +
          '</div>' +
          (c.viewership ? '<div class="ch-views">&#128065; ' + c.viewership + '</div>' : '') +
          '<div class="ch-status ' + (c.online ? 's-live' : 's-off') + '">' +
          '<div class="ch-dot"></div>' + (c.online ? 'LIVE' : 'OFF') +
          '</div></div>';
      }).join('');
      el.addEventListener('click', function(e) {
        var item = e.target.closest('.ch-item');
        if (item) openPlayer(store[item.dataset.id]);
      }, { once: true });
    }

    async function openPlayer(ch) {
      var overlay = document.getElementById('player-overlay');
      var errEl = document.getElementById('stream-err');
      errEl.classList.remove('show');
      overlay.classList.add('show');
      var iconUrl = ch.icon ? ASSETS + ch.icon : null;
      var bg = ch.color || '#0a3060';
      var init = ch.title.trim().slice(0, 2).toUpperCase();
      var cats = ch.categories ? ch.categories.slice(0, 3).join(' · ') : '';
      document.getElementById('player-info').innerHTML =
        '<div class="p-icon" style="background:' + bg + '">' +
        (iconUrl ? '<img src="' + iconUrl + '" onerror="this.outerHTML=\'' + init + '\'" alt="">' : init) +
        '</div><div>' +
        '<div class="p-meta"><span class="p-num">CH ' + ch.number + '</span>' +
        (ch.online ? '<span class="p-badge">LIVE</span>' : '') + '</div>' +
        '<div class="p-title">' + esc(ch.title) + '</div>' +
        (cats ? '<div class="p-cats">' + esc(cats) + '</div>' : '') +
        '</div>';

      var url = ch.streamUrl || ch.hls_url || ch.stream || ch.url || null;
      if (!url) {
        try { var d = await apiFetch('channels/' + ch.id); url = d.streamUrl || d.hls_url || d.stream || d.url || null; } catch(e) {}
      }
      url = url || FALLBACK(ch.id);

      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
      var video = document.getElementById('player-video');
      video.src = '';

      if (Hls.isSupported()) {
        hlsInst = new Hls({ enableWorker: true });
        hlsInst.loadSource(url);
        hlsInst.attachMedia(video);
        hlsInst.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(function(){}); });
        hlsInst.on(Hls.Events.ERROR, function(_, d) { if (d.fatal) showErr(url); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url; video.play().catch(function(){}); video.onerror = function() { showErr(url); };
      } else { showErr(url); }
    }

    function showErr(url) {
      var el = document.getElementById('stream-err');
      el.innerHTML = '<div class="err-title">Stream unavailable</div><div class="err-url">' + esc(url) + '</div>';
      el.classList.add('show');
    }

    function closePlayer() {
      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
      var v = document.getElementById('player-video');
      v.pause(); v.src = '';
      document.getElementById('player-overlay').classList.remove('show');
    }

    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var t = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b === btn); });
        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.toggle('active', c.id === 'tab-' + t); });
      });
    });

    document.getElementById('cat-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      ddOpen = !ddOpen;
      var cats = [...new Set(all.flatMap(function(c) { return c.categories || []; }))].sort();
      document.getElementById('cat-dd').innerHTML =
        ['All Categories'].concat(cats).map(function(c) {
          var val = c === 'All Categories' ? '' : c;
          return '<div class="dd-item' + (filterCat === (val || null) ? ' sel' : '') + '" data-val="' + val + '">' + esc(c) + '</div>';
        }).join('');
      document.getElementById('cat-dd').classList.toggle('hidden', !ddOpen);
    });

    document.getElementById('cat-dd').addEventListener('click', function(e) {
      var item = e.target.closest('.dd-item');
      if (!item) return;
      filterCat = item.dataset.val || null;
      document.getElementById('cat-btn').textContent = (filterCat || 'All Categories') + ' ▾';
      document.getElementById('cat-btn').classList.toggle('active', !!filterCat);
      document.getElementById('cat-dd').classList.add('hidden');
      ddOpen = false;
      applyFilter();
    });

    document.getElementById('live-btn').addEventListener('click', function() {
      filterLive = !filterLive;
      var btn = document.getElementById('live-btn');
      btn.classList.toggle('active', filterLive);
      btn.textContent = filterLive ? '● Live Now' : '○ Live Now';
      applyFilter();
    });

    document.addEventListener('click', function(e) {
      if (ddOpen && !e.target.closest('.cat-wrap')) {
        document.getElementById('cat-dd').classList.add('hidden'); ddOpen = false;
      }
    });

    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePlayer(); });

    boot();
  </script>
</body>
</html>
